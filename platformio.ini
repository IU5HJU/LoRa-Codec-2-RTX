; LoRa-Codec-2-RTX
; I test della logica girano sul PC con `make test` (vedi Makefile).

[platformio]
default_envs = lora32

[env:lora32]
platform = espressif32 @ 6.10.0
; LILYGO LoRa32 T3 V1.6.1 (ESP32-PICO-D4, 4 MB flash, senza PSRAM).
; Come nel repository ufficiale LilyGO si usa la scheda generica esp32dev.
board = esp32dev
board_build.flash_size = 4MB
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib @ 7.5.0
    sh123/esp32_codec2 @ 1.0.7
    adafruit/Adafruit SSD1306 @ 2.5.16
    adafruit/Adafruit GFX Library
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Ilib/voicecore
    -Isrc
