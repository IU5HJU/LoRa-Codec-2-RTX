; LoRa-Codec-2-RTX
; I test della logica girano sul PC con `make test` (vedi Makefile).

[platformio]
default_envs = lora32

[env:lora32]
platform = espressif32
; TODO: verificare la revisione quando arrivano le schede
;   T3 V1.6.1 / TTGO LoRa32 V2.1 -> ttgo-lora32-v21
;   TTGO LoRa32 V1               -> ttgo-lora32-v1
board = ttgo-lora32-v21
framework = arduino
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib@^6.6.0
    https://github.com/pschatzmann/arduino-codec2
