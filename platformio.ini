; VoLoRa
; I test della logica girano sul PC con `make test` (vedi Makefile).
;
; Ambienti (una scheda ciascuno):
;   lora32  LILYGO LoRa32 T3 V1.6.1 (ESP32-PICO-D4)         predefinito
;   tbeam   LILYGO T-Beam V1.2 con AXP2101 (ESP32, GPS)     fase 1, non ancora provato
;   tbeam1262  la stessa T-Beam V1.2 col modulo radio SX1262 (non SX1278): docs/tbeam-sx1262.md
;   pio run -e lora32      oppure      pio run -e tbeam

[platformio]
default_envs = lora32

[common]
platform = espressif32 @ 6.10.0
; Come nel repository ufficiale LilyGO si usa la scheda generica esp32dev (4 MB di flash).
board = esp32dev
board_build.flash_size = 4MB
; Tabella delle partizioni "min_spiffs" del framework Arduino: il programma puo' arrivare a 1,875 MB (con quella di base erano 1,25 MB, e
; il firmware ne usava gia' il 99%: basta una funzione in piu' per non entrarci). nvs (le impostazioni, 0x9000) e otadata (0xE000) restano
; dove erano, quindi aggiornare dalla pagina non cancella le impostazioni; tools/check_partitions.py lo controlla a ogni compilazione.
board_build.partitions = min_spiffs.csv
framework = arduino
extra_scripts = pre:tools/git_version.py
monitor_speed = 115200
lib_deps =
    jgromes/RadioLib @ 7.5.0
    sh123/esp32_codec2 @ 1.0.7
    adafruit/Adafruit SSD1306 @ 2.5.16
    adafruit/Adafruit GFX Library
    ESP32Async/AsyncTCP @ 3.5.0
    ESP32Async/ESPAsyncWebServer @ 3.12.1
build_flags =
    -DCORE_DEBUG_LEVEL=0
    -Ilib/voicecore
    -Isrc

[env:lora32]
extends = common
build_flags =
    ${common.build_flags}
    -DBOARD_T3_V161

[env:tbeam]
extends = common
lib_deps =
    ${common.lib_deps}
    lewisxhe/XPowersLib @ 0.2.6
build_flags =
    ${common.build_flags}
    -DBOARD_TBEAM_V12

; Stessa scheda T-Beam V1.2 (AXP2101) con il modulo LILYGO LoRa32 SX1262 al posto dell'SX1278: stessi pin, cambia il chip radio.
[env:tbeam1262]
extends = common
lib_deps =
    ${common.lib_deps}
    lewisxhe/XPowersLib @ 0.2.6
build_flags =
    ${common.build_flags}
    -DBOARD_TBEAM_V12
    -DRADIO_SX1262
