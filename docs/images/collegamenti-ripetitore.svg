<text x="40" y="44" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" text-anchor="start" fill="#111827">Ripetitore: due T3 collegate con quattro fili</text>
<text x="40" y="72" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="normal" text-anchor="start" fill="#4b5563">Le due schede sono T3 normali, gia' cablate (microfono, altoparlante, pulsanti): per il ripetitore si aggiungono solo i quattro fili.</text>
<rect x="140" y="110" width="420" height="560" rx="18" fill="#1f2937" stroke="#111827" stroke-width="2"/>
