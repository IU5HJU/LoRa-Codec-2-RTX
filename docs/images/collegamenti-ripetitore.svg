<rect x="640" y="156" width="24" height="20" rx="4" fill="#dc2626" stroke="none" stroke-width="0"/>
<text x="676" y="172" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#111827">5V - 5V</text>
<text x="860" y="172" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#4b5563">alimentazione (vedi procedura)</text>
<rect x="640" y="190" width="24" height="20" rx="4" fill="#111827" stroke="none" stroke-width="0"/>
<text x="676" y="206" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#111827">GND - GND</text>
<text x="860" y="206" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#4b5563">massa comune</text>
<rect x="640" y="224" width="24" height="20" rx="4" fill="#0d9488" stroke="none" stroke-width="0"/>
<text x="676" y="240" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#111827">RX.IO2 -&gt; TX.S_VP</text>
<text x="860" y="240" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#4b5563">seriale RX -&gt; TX</text>
<rect x="640" y="258" width="24" height="20" rx="4" fill="#7c3aed" stroke="none" stroke-width="0"/>
<text x="676" y="274" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" text-anchor="start" fill="#111827">RX.S_VP &lt;- TX.IO2</text>
<text x="860" y="274" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#4b5563">seriale TX -&gt; RX</text>
<text x="850" y="340" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#4b5563">115200 baud, 3,3 V</text>
<rect x="140" y="700" width="420" height="150" rx="10" fill="#fffbeb" stroke="#d97706" stroke-width="2"/>
<text x="350" y="730" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="bold" text-anchor="middle" fill="#92400e">Altoparlante di monitor (facoltativo, per il sysop)</text>
<text x="350" y="756" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#92400e">MAX98357A + altoparlante 8 ohm, come sulla scheda normale:</text>
<text x="350" y="780" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#92400e">IO14 BCLK, IO13 LRC, IO4 DIN, IO25 SD, 5V e GND</text>
<text x="350" y="806" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="normal" text-anchor="middle" fill="#92400e">Pulsante del volume (facoltativo): IO15 e GND</text>
<text x="350" y="832" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="13" font-weight="bold" text-anchor="middle" fill="#92400e">Il microfono (IO34), se c'e', resta com'e'</text>
<rect x="40" y="916" width="1620" height="196" rx="10" fill="#f9fafb" stroke="#e5e7eb" stroke-width="2"/>
<text x="60" y="948" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#374151">Quattro fili fra le due schede: 5V, GND e la seriale incrociata. RX e TX usano gli stessi due pin, IO2 (TX) e S_VP = IO36 (RX): la T3 e' la stessa, cambia solo il ruolo (CFG SET ROLE).</text>
<text x="60" y="978" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#374151">Nessun pin del cablaggio normale e' toccato (microfono IO34 compreso). S_VP e' solo ingresso senza pull-up interno; IO2 e' il MISO dello slot microSD: microSD sempre tolta.</text>
<text x="60" y="1008" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#374151">Il display di ciascuna scheda mostra lo stato: 'TX ok' sulla RX e 'RX ok' sulla TX indicano che la seriale funziona. Fili corti e lontani dall'antenna.</text>
<text x="60" y="1038" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#374151">Il ripetitore usa solo la T3: due T-Beam sarebbero uno spreco. Senza nominativo (N0CALL) la scheda TX non trasmette: ideale per la prova a banco.</text>
<text x="60" y="1068" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#374151">Procedura di prova: docs/banco-ripetitore.md.</text>
<text x="60" y="1098" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="start" fill="#6b7280">Fonte: docs/pinout.md e src/board_pins_t3_v161.h. Generato da tools/render_wiring.py.</text>
</svg>
