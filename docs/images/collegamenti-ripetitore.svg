<text x="350" y="200" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#e5e7eb">LILYGO LoRa32 T3 V1.6.1</text>
<text x="350" y="236" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="28" font-weight="bold" text-anchor="middle" fill="#ffffff">SCHEDA RX</text>
<text x="350" y="266" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="14" font-weight="normal" text-anchor="middle" fill="#d1d5db">ascolta l'ingresso, manda alla TX</text>
<text x="350" y="330" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#9ca3af">USB in alto, faccia con le sigle dei pin</text>
<text x="350" y="354" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#9ca3af">Antenna a 433 MHz sempre collegata</text>
<text x="350" y="378" font-family="DejaVu Sans, Arial, Helvetica, sans-serif" font-size="12" font-weight="normal" text-anchor="middle" fill="#9ca3af">microSD tolta</text>
