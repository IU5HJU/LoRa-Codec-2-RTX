name: Build

# Test sul PC e compilazione del firmware per la LILYGO LoRa32 T3 V1.6.1.
# Produce due binari, pronti per un flasher web (esp-web-tools):
#   web_factory.bin  immagine completa da scrivere all'indirizzo 0 (prima installazione)
#   ota_update.bin   solo l'applicazione, da scrivere a 0x10000 (aggiornamento)
# Con un tag "v*" i binari vengono anche pubblicati in una release di GitHub.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test sul PC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make test
        run: make test

  firmware:
    name: Firmware T3 V1.6.1
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache di PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Installa PlatformIO ed esptool
        run: pip install platformio==6.1.19 esptool==4.8.1

      - name: Compila
        run: pio run -e lora32

      - name: Crea i binari per il flasher
        run: |
          set -euo pipefail
          B=.pio/build/lora32
          BOOT_APP0=$(find "$HOME/.platformio/packages" -name boot_app0.bin | head -n 1)
          test -n "$BOOT_APP0"
          mkdir -p dist
          esptool.py --chip esp32 merge_bin -o dist/web_factory.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 "$B/bootloader.bin" \
            0x8000 "$B/partitions.bin" \
            0xe000 "$BOOT_APP0" \
            0x10000 "$B/firmware.bin"
          cp "$B/firmware.bin" dist/ota_update.bin
          (cd dist && sha256sum web_factory.bin ota_update.bin > SHA256SUMS)
          ls -l dist
          cat dist/SHA256SUMS

      - name: Dimensioni (RAM e flash)
        run: pio run -e lora32 -t size

      - uses: actions/upload-artifact@v4
        with:
          name: firmware-t3-v161
          path: dist/*
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: firmware-t3-v161
          path: dist
      - name: Crea la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
