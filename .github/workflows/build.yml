name: Build

# Test sul PC e compilazione del firmware per le schede supportate:
#   lora32  LILYGO LoRa32 T3 V1.6.1   artefatto firmware-t3-v161
#   tbeam   LILYGO T-Beam V1.2        artefatto firmware-tbeam-v12
#   tbeam_nodisplay  T-Beam V1.2 senza display  artefatto firmware-tbeam-v12-senza-display
# Ogni artefatto contiene due binari, pronti per un flasher web (esp-web-tools):
#   web_factory.bin  immagine completa da scrivere all'indirizzo 0 (prima installazione)
#   ota_update.bin   solo l'applicazione, da scrivere a 0x10000 (aggiornamento)
# Con un tag "v*" i binari di tutte le schede vengono anche pubblicati in una release.
# Su main e sui tag "v*" il job "pages" pubblica su GitHub Pages la pagina di installazione e
# configurazione (cartella site/) con i binari appena compilati. Richiede, una volta sola,
# Settings -> Pages -> Source: GitHub Actions.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: Test sul PC
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: make test
        run: make test
      - name: Parte Python del ricevitore SDR
        run: make test-py

  page:
    name: Prova della pagina web
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Installa Playwright (senza scaricare browser)
        run: npm install --no-save playwright@1.49.1
      - name: Prova la pagina con un dispositivo seriale finto (Chrome del runner)
        env:
          PW_CHANNEL: chrome
        run: |
          test -x /opt/google/chrome/chrome || { echo "Chrome non trovato sul runner"; exit 1; }
          node tests/page/run.js

  firmware:
    name: Firmware ${{ matrix.board }}
    runs-on: ubuntu-latest
    needs: test
    strategy:
      fail-fast: false
      matrix:
        include:
          - env: lora32
            board: T3 V1.6.1
            artifact: firmware-t3-v161
          - env: tbeam
            board: T-Beam V1.2
            artifact: firmware-tbeam-v12
          - env: tbeam_nodisplay
            board: T-Beam V1.2 senza display
            artifact: firmware-tbeam-v12-senza-display
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cache di PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio/.cache
            ~/.platformio/packages
            ~/.platformio/platforms
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Installa PlatformIO ed esptool
        run: pip install platformio==6.1.19 esptool==4.8.1

      - name: Compila
        run: pio run -e ${{ matrix.env }}

      - name: Crea i binari per il flasher
        run: |
          set -euo pipefail
          B=.pio/build/${{ matrix.env }}
          BOOT_APP0=$(find "$HOME/.platformio/packages" -name boot_app0.bin | head -n 1)
          test -n "$BOOT_APP0"
          mkdir -p dist
          esptool.py --chip esp32 merge_bin -o dist/web_factory.bin \
            --flash_mode dio --flash_freq 40m --flash_size 4MB \
            0x1000 "$B/bootloader.bin" \
            0x8000 "$B/partitions.bin" \
            0xe000 "$BOOT_APP0" \
            0x10000 "$B/firmware.bin"
          cp "$B/firmware.bin" dist/ota_update.bin
          (cd dist && sha256sum web_factory.bin ota_update.bin > SHA256SUMS)
          ls -l dist
          cat dist/SHA256SUMS

      - name: Dimensioni (RAM e flash)
        run: pio run -e ${{ matrix.env }} -t size

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/*
          if-no-files-found: error

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: firmware
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: dist
      - name: Crea la release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p release
          for d in dist/firmware-*; do
            n=$(basename "$d")
            cp "$d/web_factory.bin" "release/${n}-web_factory.bin"
            cp "$d/ota_update.bin" "release/${n}-ota_update.bin"
          done
          (cd release && sha256sum *.bin > SHA256SUMS)
          # Un tag con un trattino (v0.1.0-beta.1, v0.1.0-rc.1) e' una versione di prova: pre-release su GitHub,
          # cosi' non diventa la "ultima versione" per chi non vuole le beta (docs/versioni.md).
          flags=""
          case "$GITHUB_REF_NAME" in *-*) flags="--prerelease" ;; esac
          gh release create "$GITHUB_REF_NAME" release/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes $flags

  pages:
    name: Pubblica su GitHub Pages
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    needs: [firmware, page]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: firmware-*
          path: dist
      - name: Assembla il sito
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then v="${GITHUB_REF_NAME}"; else v="main-$(TZ=Europe/Rome date +%d/%m/%Y)"; fi
          tools/make_site.sh dist _site "$v" "$GITHUB_SHA"
          find _site -type f | sort
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Attendi che l'artefatto del sito sia visibile
        # L'elenco degli artefatti di GitHub a volte non mostra subito quello appena caricato
        # ("No artifacts named github-pages were found"): una breve pausa evita il falso errore.
        run: sleep 30
      - name: Pubblica
        id: deploy
        uses: actions/deploy-pages@v4
